<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Groove</title>
<style>
  :root { --bg:#111; --fg:#eee; --dim:#555; --hot:#ff6a2b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); user-select:none;
         display:flex; flex-direction:column; min-height:100vh; gap:18px; }
  h1 { font-size:14px; letter-spacing:.2em; color:var(--dim); margin:16px 0 0; text-transform:uppercase; }
  select, button { font:inherit; color:var(--fg); background:#222; border:0; border-radius:12px; padding:14px; }
  select { width:100%; font-size:18px; }
  .bpm { text-align:center; font-size:88px; font-weight:200; font-variant-numeric:tabular-nums; line-height:1; }
  .bpm small { display:block; font-size:13px; color:var(--dim); letter-spacing:.2em; }
  input[type=range] { width:100%; accent-color:var(--hot); height:40px; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .row button { font-size:18px; }
  .grid { display:grid; gap:4px; }
  .cell { height:10px; border-radius:3px; background:#222; transition:background .05s; }
  .cell.on { background:#444; } .cell.now { background:var(--hot); }
  #play { font-size:22px; padding:22px; background:var(--hot); color:#000; font-weight:600; }
  #play.on { background:#333; color:var(--fg); }
  .mute { padding:8px 12px; font-size:14px; }
  .mute.on { background:#552; color:#ffd; text-decoration:line-through; }
  .sec.on { background:var(--hot); color:#000; font-weight:600; }
  .sec.queued { box-shadow: inset 0 0 0 2px var(--hot); animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { box-shadow: inset 0 0 0 2px transparent; } }
  .opts { display:flex; gap:8px; flex-wrap:wrap; color:#aaa; font-size:14px; }
  .opts label { background:#1b1b1b; border-radius:10px; padding:10px 12px; display:flex; gap:6px; align-items:center; }
  .opts input[type=number] { width:48px; background:#222; color:var(--fg); border:0; border-radius:6px; padding:4px; font:inherit; }
</style>
</head>
<body>
  <h1>Groove</h1>
  <select id="pattern"></select>
  <select id="kit">
    <option value="muldjord">Studio kit (full)</option>
    <option value="blondebop">Jazz kit (bop)</option>
    <option value="acoustic-kit">Acoustic kit (basic)</option>
    <option value="LINN">LinnDrum</option>
    <option value="R8">Roland R-8</option>
    <option value="CR78">CR-78</option>
    <option value="Stark">Stark</option>
    <option value="">Synth</option>
  </select>
  <div class="bpm"><span id="bpm">90</span><small>BPM</small></div>
  <input id="slider" type="range" min="30" max="240" value="90">
  <div class="row">
    <button data-d="-5">−5</button><button data-d="-1">−1</button>
    <button data-d="1">+1</button><button data-d="5">+5</button>
  </div>
  <div id="status" style="text-align:center;color:#999;font-size:14px;min-height:20px;font-variant-numeric:tabular-nums"></div>
  <div class="row" style="grid-template-columns:1fr 1fr 1fr">
    <button id="verse" class="sec">Verse</button><button id="chorus" class="sec">Chorus</button><button id="tap">Tap</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="mutes" class="opts" style="justify-content:center">
    <span style="align-self:center">Mute:</span>
    <button class="mute" data-keys="k">Kick</button>
    <button class="mute" data-keys="st">Snare</button>
    <button class="mute" data-keys="hor">Hats/Ride</button>
    <button class="mute" data-keys="c123">Cymbals/Toms</button>
  </div>
  <div class="opts">
    <label><input id="countin" type="checkbox" checked> 1-bar count-in</label>
    <label style="flex:1 1 100%">Feel <span style="color:#666">tight</span>
      <input id="feel" type="range" min="0" max="100" value="50" style="flex:1;height:28px">
      <span style="color:#666">loose</span></label>
    <label>Song <select id="song" style="padding:4px 6px;font-size:14px;width:auto">
      <option value="">Manual</option>
      <option value="v8,c8">Verse 8 / Chorus 8</option>
      <option value="v4,c4">Verse 4 / Chorus 4</option>
      <option value="v8,c8,v8,c16">V8 C8 V8 C16</option>
      <option value="v12,c12">12 / 12 (blues form)</option>
    </select></label>
    <label>Gap <select id="gap" style="padding:4px 6px;font-size:14px;width:auto">
      <option value="">Off</option>
      <option value="3,1">3 on / 1 off</option>
      <option value="2,2">2 on / 2 off</option>
      <option value="4,4">4 on / 4 off</option>
      <option value="1,3">1 on / 3 off</option>
    </select></label>
    <label>Fills <select id="fills" style="padding:4px 6px;font-size:14px;width:auto">
      <option value="0">Off</option><option value="4">Every 4 bars</option><option value="8">Every 8 bars</option>
    </select></label>
    <label><input id="trainer" type="checkbox"> Speed up
      <input id="tradd" type="number" value="2" min="1">bpm every
      <input id="trevery" type="number" value="4" min="1">bars to
      <input id="trmax" type="number" value="140" min="30"></label>
  </div>
  <button id="dropback" style="display:none">Drop back 10 BPM</button>
  <button id="play">Play</button>
  <p style="color:#555;font-size:11px;text-align:center;margin:0 0 12px">Drum samples provided by DrumGizmo.org (MuldjordKit, CC BY 4.0) and AVL Drumkits by Glen MacArthur (Blonde Bop, CC BY-SA 3.0) and Google web-audio-samples (Apache 2.0).</p>
<script type="module" src="app.js"></script>
</body>
</html>
